
services:
  app:
    build: .
    container_name: xiujiao-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ${RUNTIME_DIR:-./runtime}/data.json:/app/src/data.json
      - ${RUNTIME_DIR:-./runtime}/daily_pwd.json:/app/src/daily_pwd.json
      - ${RUNTIME_DIR:-./runtime}/collect_settings.json:/app/scripts/collect_settings.json
      - ${RUNTIME_DIR:-./runtime}/auto_logs.json:/app/scripts/auto_logs.json
      - ${RUNTIME_DIR:-./runtime}/daily_pwd_logs.json:/app/scripts/daily_pwd_logs.json
      - ${RUNTIME_DIR:-./runtime}/auto_processed_videos.json:/app/scripts/auto_processed_videos.json
      - ${RUNTIME_DIR:-./runtime}/cookies.txt:/app/scripts/cookies.txt
      - ${RUNTIME_DIR:-./runtime}/users.json:/app/scripts/users.json
      - ${RUNTIME_DIR:-./runtime}/community_posts.json:/app/scripts/community_posts.json
      - ${RUNTIME_DIR:-./runtime}/community_activity.json:/app/scripts/community_activity.json
      - ${RUNTIME_DIR:-./runtime}/community_comments.json:/app/scripts/community_comments.json
      - ${RUNTIME_DIR:-./runtime}/godspot:/app/runtime/godspot
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET}
      - CF_UPLOAD_URL=${CF_UPLOAD_URL}
      - CF_AUTH_TOKEN=${CF_AUTH_TOKEN}
      - DEFAULT_PROVIDER_BASE_URL=${DEFAULT_PROVIDER_BASE_URL:-https://api.yousn.me/v1}
      - DEFAULT_PROVIDER_API_KEY=${DEFAULT_PROVIDER_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.yousn.me/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-openai/gpt-oss-120b}
      - COLLECT_WRITE_DEBUG_FILES=${COLLECT_WRITE_DEBUG_FILES:-false}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/builds', (r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
